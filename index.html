<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d1d1d1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Texture Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Sorts+Mill+Goudy:ital@0;1&family=Newsreader:opsz,wght@6..72,400;6..72,700&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, tactile, quiet
   IDEA a pocket digital camera that collects surfaces; the roll becomes folders and envelopes
   PICTURE the camera body itself (capture), then the texture roll as a carousel of objects
   COLOUR fog grey #d1d1d1 ground, champagne plastic body, charcoal LCD, sage tint chip
   TYPE Newsreader for names, Geist for meta, VT323 for LCD readouts
   LAYOUT one 402×891 phone screen, scaled to fit; wide screens keep big side margins */
:root{--safe-t:env(safe-area-inset-top,0px);color-scheme:light;--fog:#d1d1d1;--ink:#111;--muted:#757575;--chip:rgba(128,128,128,.2);--glass:rgba(255,255,255,.2)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;touch-action:manipulation;overscroll-behavior:none}
body{background:#c3c3c1;color:var(--ink);font:14px/1.4 Geist,ui-sans-serif,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid #2b5bd7;outline-offset:2px}
#frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#app{position:absolute;left:0;top:0;width:var(--W,430px);height:var(--H,932px);transform-origin:0 0;background:var(--fog);border-radius:32px;overflow:hidden;overflow:clip;box-shadow:0 30px 80px -30px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.04)}
.phone #app{border-radius:0;box-shadow:none}
.phone body,body.phone{background:var(--fog)}
.screen{position:absolute;inset:0;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.screen.off{opacity:0;pointer-events:none;transform:scale(.98)}
.ic{width:24px;height:24px;display:block;fill:none;stroke:#1e1e1e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.logo{position:absolute;left:26px;top:calc(27px + var(--safe-t,0px));height:36px;display:flex;align-items:center;gap:8px;user-select:none}
.logo i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#fff,#bdbdb8 60%,#8d8d88);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.logo span{font:italic 400 28px/1 "Sorts Mill Goudy",Newsreader,Georgia,serif;letter-spacing:-1px;color:#7a7a77}
.logo .mark{font:28px/1 system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;letter-spacing:0;filter:grayscale(1) contrast(.55) brightness(1.08) drop-shadow(0 1px 0 rgba(255,255,255,.95)) drop-shadow(0 -1px 0 rgba(0,0,0,.28));opacity:.62}
.hint{display:none!important}
.modetag{position:absolute;left:0;right:0;top:526px;text-align:center;font-size:11.5px;color:#8b8b8b;pointer-events:none;transition:opacity .3s}
.minicam{position:absolute;right:22px;top:calc(24.5px + var(--safe-t,0px));width:74px;height:38px;border-radius:4px;filter:drop-shadow(0 2.5px 2.5px rgba(0,0,0,.3)) drop-shadow(0 5px 6px rgba(0,0,0,.12))}
.minicam svg{display:block;width:100%;height:100%}
.pop{position:absolute;left:18px;top:70px;z-index:20;background:rgba(245,245,245,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(5,36px);gap:8px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);transform-origin:20px 0;transition:opacity .2s,transform .2s}
.pop.off{opacity:0;transform:scale(.9);pointer-events:none}
.pop button{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pop .grad{background-size:cover;background-position:center}
.pop button[aria-pressed=true]{outline:2px solid #111;outline-offset:2px}
.pop .orig{background:conic-gradient(#d8c9b5 0 25%,#7a8f63 0 50%,#c98a6a 0 75%,#8aa3b8 0)}
.pop p{grid-column:1/-1;margin:2px 2px 0;font-size:11.5px;color:var(--muted)}

/* carousel */
.roll{position:absolute;left:0;right:0;top:92px;height:462px;perspective:900px;perspective-origin:50% 50%;transform-style:preserve-3d;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.it{position:absolute;transition:transform .5s cubic-bezier(.2,.8,.2,1),left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1),opacity .4s,border-radius .45s;cursor:pointer;backface-visibility:hidden}
.it:not(.center) .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 60%)}
.it .ph{position:absolute;inset:0;overflow:hidden;border-radius:inherit;background-color:#bdbdbb;background-repeat:no-repeat;background-position:0 0;background-size:332px 442px;transition:opacity .35s}
.roll.dragging .it{transition:opacity .2s,border-radius .45s !important}
.it.tile .ph{background-repeat:repeat;background-size:112px 112px;background-position:center}
.it.tile.glassy .ph{background-size:200px 200px}
.grid .g.tile.glassy{background-size:118px}
.it.card .ph{box-shadow:0 10px 18px -6px rgba(0,0,0,.35),0 2px 3px rgba(0,0,0,.2)}
.it .obj{position:absolute;inset:0;opacity:0;transition:opacity .35s}
.it.as-obj .ph{opacity:0}
.it.as-obj .obj{opacity:1}
.it.as-obj.center:not(.env){filter:drop-shadow(0 18px 16px rgba(0,0,0,.15)) drop-shadow(0 5px 6px rgba(0,0,0,.25))}
.it .obj svg{width:100%;height:100%;display:block;overflow:visible}
.osd{position:absolute;inset:14px 16px;font:19px/1 VT323,ui-monospace,monospace;color:rgba(255,255,255,.82);text-shadow:0 0 6px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .3s .1s}
.it.center:not(.as-obj) .osd{opacity:1}
.osd span{position:absolute}
.osd{display:none}
.shimmer{background:linear-gradient(100deg,#c4c4c2 30%,#d8d8d6 50%,#c4c4c2 70%) 0 0/300% 100% !important;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-300% 0}}

/* grid */
.grid{position:absolute;left:0;right:0;top:calc(84px + var(--safe-t,0px));bottom:calc(88px + env(safe-area-inset-bottom));overflow:auto;padding:12px 22px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;align-content:start}
.grid button{text-align:left}
.grid .g{aspect-ratio:3/4;border-radius:16px;background-size:cover;background-position:center;background-color:#c4c4c2;box-shadow:0 4px 8px -2px rgba(0,0,0,.2)}
.grid .g.tile{background-size:64px;background-position:center}
.grid .n{font:15px/1.2 Newsreader,Georgia,serif;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid .d{font-size:11.5px;color:var(--muted)}

/* info */
.info{position:absolute;left:36px;right:36px;top:566px;padding:4px;display:flex;justify-content:space-between;align-items:flex-start;transition:opacity .25s}
.info h2{margin:0;font:400 20px/normal Newsreader,Georgia,serif;letter-spacing:-.005em;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{margin-top:14px;font-size:12px;line-height:16px;color:var(--muted)}
.acts{display:flex;gap:6px;flex:none}
.dl{width:31.7px;height:31px;border-radius:6px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.dl .ic{width:16px;height:16px;stroke-width:1.7}
.dl.busy{opacity:.5;cursor:progress}
.hint{position:absolute;left:40px;right:40px;bottom:calc(98px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:#8b8b8b}

/* bottom nav */
.nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:8px;border-radius:100px;background:var(--glass);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.nav button{width:48px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.nav button[aria-pressed=true],.nav button[aria-expanded=true]{background:var(--chip)}
.nav .sw{width:22px;height:22px;border-radius:50%;background:conic-gradient(#d8c9b5 0 25%,#7a8f63 0 50%,#c98a6a 0 75%,#8aa3b8 0);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.6)}
.pop.low{top:auto;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;margin-left:-118px;transform-origin:50% 100%}

/* camera — Y2K silver compact: brushed aluminium, raised screen frame, chrome keys + dial, tiny printed blue/red icons */
#camera{transition:none}
#camera.off{transform:none}
.body{position:absolute;left:8px;right:8px;top:calc(8px + var(--safe-t,0px));bottom:calc(97px + env(safe-area-inset-bottom));border-radius:30px;overflow:hidden;transform-origin:50% 50%;
  background:var(--m-body) 50% calc(50% + var(--ly,0) * 6%)/100% 112% no-repeat,#c9c9c6;
  box-shadow:0 6px 10px 4px rgba(0,0,0,.14),0 2px 3px rgba(0,0,0,.3)}
.body::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2.5px;z-index:3;background:linear-gradient(145deg,#fff 0%,rgba(255,255,255,.95) 10%,rgba(255,255,255,.2) 32%,rgba(255,255,255,0) 50%,rgba(0,0,0,.08) 68%,rgba(0,0,0,.4) 92%,rgba(0,0,0,.55) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.body::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:14px;z-index:2;background:linear-gradient(145deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.25) 20%,rgba(255,255,255,0) 42%,rgba(0,0,0,0) 60%,rgba(0,0,0,.12) 82%,rgba(0,0,0,.26) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none;filter:blur(1px)}
.sheen{position:absolute;inset:-30%;pointer-events:none;z-index:0;mix-blend-mode:overlay;opacity:.7;
  background:radial-gradient(70% 55% at calc(50% - var(--lx,0) * 40%) calc(40% - var(--ly,0) * 34%),rgba(255,255,255,.42) 0,rgba(255,255,255,.3) 18%,rgba(255,255,255,.17) 38%,rgba(255,255,255,.07) 60%,rgba(255,255,255,.02) 80%,rgba(255,255,255,0) 100%),
             radial-gradient(80% 60% at calc(50% + var(--lx,0) * 36%) calc(80% + var(--ly,0) * 22%),rgba(0,0,0,.2) 0,rgba(0,0,0,.12) 30%,rgba(0,0,0,.05) 60%,rgba(0,0,0,0) 100%)}
.body .grain{display:none}
.frame{position:absolute;left:16px;right:16px;top:16px;bottom:269px;border-radius:20px;
  background:var(--m-frame) center/100% 100% no-repeat,#d6d6d3;
  box-shadow:0 1px 0 rgba(0,0,0,.2),0 3px 4px rgba(0,0,0,.24),0 8px 14px rgba(0,0,0,.1)}
.frame::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(150deg,#fff 0%,#fff 14%,rgba(255,255,255,.1) 40%,rgba(0,0,0,.05) 60%,rgba(0,0,0,.35) 90%,rgba(0,0,0,.45) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:9px;background:linear-gradient(150deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 35%,rgba(0,0,0,0) 62%,rgba(0,0,0,.14) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.bezel{position:absolute;left:14px;right:14px;top:14px;bottom:54px;border-radius:7px;background:#0d0d0d;box-shadow:inset 0 0 0 2px #2a2a2a,0 0 0 2px #9d9d99,0 0 0 3px rgba(255,255,255,.8)}
.lcd{position:absolute;left:8px;top:8px;right:8px;bottom:8px;border-radius:3px;overflow:hidden;background:#121412}
.lcd.texmode video,.lcd.texmode .still{filter:grayscale(1) contrast(1.75) brightness(1.08)}
.lcd .ro span.texro{position:static;display:none}
.lcd.texmode .ro span.texro{display:inline}
.key.on{transform:translateY(-3px)}
.key.on svg{stroke:#2b2a27}
.lcd video,.lcd .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background-size:cover;background-position:center}
.lcd .still{filter:saturate(.9) contrast(.96)}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(128deg,rgba(255,255,255,.16),transparent 32%),repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px)}
.lcd .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.lcd .flash.go{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.lcd .ro{position:absolute;inset:12px 14px;font:22px/1 VT323,ui-monospace,monospace;color:rgba(255,255,255,.92);text-shadow:0 0 6px rgba(0,0,0,.6);pointer-events:none;z-index:2}
.lcd .ro span{position:absolute}
.focus{position:absolute;left:50%;top:50%;width:84px;height:64px;transform:translate(-50%,-50%);pointer-events:none;z-index:2;
  background:linear-gradient(#fff,#fff) 0 0/14px 2px,linear-gradient(#fff,#fff) 0 0/2px 14px,linear-gradient(#fff,#fff) 100% 0/14px 2px,linear-gradient(#fff,#fff) 100% 0/2px 14px,linear-gradient(#fff,#fff) 0 100%/14px 2px,linear-gradient(#fff,#fff) 0 100%/2px 14px,linear-gradient(#fff,#fff) 100% 100%/14px 2px,linear-gradient(#fff,#fff) 100% 100%/2px 14px;background-repeat:no-repeat;opacity:.85}
.lcd .msg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:24px/1.15 VT323,monospace;color:#cfe3c9;padding:0 30px;z-index:2}
.vthumb{display:none}
.vwin,.vwlbl{display:none}
/* full-screen camera: viewfinder window takes the old roll slot, TEX moves up beside the dial */
.full .vthumb{display:none!important}
.full .vwlbl{display:block;bottom:86px!important}
.full #texLbl,.full #texSock{display:none!important}
.full .slide{left:auto;right:26px;bottom:238px}
.full .rearlbl{left:auto!important;right:66px;bottom:218px!important}
.full .frontlbl{left:auto!important;right:24px;bottom:218px!important}
.full .vwin{display:block;position:absolute;left:86px;bottom:40px;width:68px;height:88px;border-radius:12px;padding:6px;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.04) 40%,rgba(255,255,255,.12)),var(--m-spun) center/180% 180%,#bdbdb9;
  box-shadow:inset 0 3px 5px rgba(0,0,0,.42),inset 0 1px 1px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.55),0 1px 0 rgba(255,255,255,.85),0 -1px 0 rgba(0,0,0,.18);transition:filter .08s}
.full .vwin:active{filter:brightness(.92)}
.full .vwin .glass{position:absolute;inset:6px;border-radius:7px;background:#111 center/cover no-repeat;overflow:hidden;
  box-shadow:inset 0 0 0 2px #1b1b1b,inset 0 4px 8px rgba(0,0,0,.8),inset 0 -1px 2px rgba(255,255,255,.12),0 1px 0 rgba(255,255,255,.35)}
.full .vwin .glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.42) 0,rgba(255,255,255,.08) 34%,transparent 35%,transparent 70%,rgba(255,255,255,.06) 100%)}
.full .vthumb{display:block;position:absolute;left:50%;bottom:16px;width:44px;height:58px;margin-left:-22px;z-index:4;border-radius:4px;border:1.5px solid rgba(255,255,255,.9);
  background:#2a2a2a center/cover no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.5),3px -3px 0 -1.5px rgba(255,255,255,.35),6px -6px 0 -3px rgba(255,255,255,.18);-webkit-tap-highlight-color:transparent}
.full .vthumb:active{transform:scale(.94)}
.full .body{left:0;right:0;top:0;bottom:0;border-radius:0;box-shadow:none}
.full .body::before,.full .body::after{display:none}
.full .frame{top:calc(16px + var(--safe-t,0px));bottom:calc(269px + env(safe-area-inset-bottom))}
.full .body > :not(.frame):not(.grain){margin-bottom:env(safe-area-inset-bottom)}
body.full #app{border-radius:0}
/* 3D camera version (?cam3d): a solid object floating on a dark backdrop, 20px in from the edges, turning with the phone */
.cam3d #app{background:var(--fog)}
.cam3d #camera{background:transparent}
.cam3d .body{left:20px;right:20px;top:calc(20px + var(--safe-t,0px));bottom:calc(20px + env(safe-area-inset-bottom));border-radius:40px;
  transform:perspective(1500px) rotateX(calc(var(--ly,0) * -7deg)) rotateY(calc(var(--lx,0) * 9deg)) scale(.8);
  box-shadow:calc(var(--lx,0) * -0.75px) calc(0.95px + var(--ly,0) * 0.55px) 0 #c4c4c0,calc(var(--lx,0) * -1.50px) calc(1.90px + var(--ly,0) * 1.10px) 0 #bdbdb9,calc(var(--lx,0) * -2.25px) calc(2.85px + var(--ly,0) * 1.65px) 0 #b6b6b2,calc(var(--lx,0) * -3.00px) calc(3.80px + var(--ly,0) * 2.20px) 0 #afafab,calc(var(--lx,0) * -3.75px) calc(4.75px + var(--ly,0) * 2.75px) 0 #a8a8a4,calc(var(--lx,0) * -4.50px) calc(5.70px + var(--ly,0) * 3.30px) 0 #a1a19d,calc(var(--lx,0) * -5.25px) calc(6.65px + var(--ly,0) * 3.85px) 0 #9a9a96,calc(var(--lx,0) * -6.00px) calc(7.60px + var(--ly,0) * 4.40px) 0 #93938f,calc(var(--lx,0) * -6.75px) calc(8.55px + var(--ly,0) * 4.95px) 0 #8c8c88,calc(var(--lx,0) * -7.50px) calc(9.50px + var(--ly,0) * 5.50px) 0 #858581,calc(var(--lx,0) * -8.25px) calc(10.45px + var(--ly,0) * 6.05px) 0 #7e7e7a,calc(var(--lx,0) * -9.00px) calc(11.40px + var(--ly,0) * 6.60px) 0 #777773,calc(var(--lx,0) * -9.75px) calc(12.35px + var(--ly,0) * 7.15px) 0 #70706c,calc(var(--lx,0) * -10.50px) calc(13.30px + var(--ly,0) * 7.70px) 0 #696965,calc(var(--lx,0) * -14px) calc(34px + var(--ly,0) * 10px) 44px rgba(0,0,0,.28),0 10px 18px rgba(0,0,0,.2)}
.cam3d .body::before,.cam3d .body::after{display:block}
.cam3d .frame{top:16px}

.full .strip{display:none}
.lcd .startbtn{position:absolute;inset:0;z-index:3}
.brand span{display:inline-block;font:24px/1 system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:grayscale(1) contrast(.6) brightness(.92) drop-shadow(0 1px 0 rgba(255,255,255,.9)) drop-shadow(0 -1px 0 rgba(0,0,0,.3));opacity:.75}
.brand{position:absolute;left:0;right:0;bottom:14px;text-align:center;font:700 25px/1 Newsreader,Georgia,serif;letter-spacing:.01em;color:#5d5d5a;text-shadow:0 1px 0 rgba(255,255,255,.85),0 -1px 0 rgba(0,0,0,.18)}
.model{position:absolute;right:22px;bottom:23px;font:600 9px/1 Geist,sans-serif;letter-spacing:.14em;color:#7c7c78}
.led{position:absolute;left:22px;bottom:23px;display:flex;align-items:center;gap:5px;font:600 9px/1 Geist,sans-serif;letter-spacing:.14em;color:#7c7c78}
.led i{width:6px;height:6px;border-radius:50%;background:#8e8e8a;box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.led.on i{background:#64d14a;box-shadow:0 0 5px #8ff26f}
.prt{position:absolute;font:600 9.5px/1 Geist,sans-serif;letter-spacing:.12em;color:#585855;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.prt.red{color:#585855}
.prt svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.key{position:absolute;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:translateY(-8px);
  background:var(--m-dome) calc(50% + var(--lx,0) * 26%) calc(50% + var(--ly,0) * 26%)/135% 135% no-repeat,#cfcfcc;

  const check = async () => {
    try { const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return; const v = h(await r.text());
      if (mine === null) mine = v; else if (v !== mine) location.reload(); } catch {}
  };
  check();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
}

/* ================= boot ================= */
buildRoll();
(function gen() {
  const it = items.find(x => x.sample && !x.url); if (!it) return;
  const H = SAMPLES[it.si][1](), A = new Uint8ClampedArray(S * S * 4);
  for (let k = 0; k < S * S; k++) { const g = 208 + (H[k] - .5) * 44; A[k * 4] = g; A[k * 4 + 1] = g - 1; A[k * 4 + 2] = g - 3; A[k * 4 + 3] = 255; }   // neutral: colour comes from the background
  const c = cache.get(it.id) || {}; cache.set(it.id, c); c.ex = { height: H, albedo: A };
  it.url = toCanvas(finish(it, A, H, .24, 3)).toDataURL('image/jpeg', .9); layout(true); if (view === 'grid') buildGrid(); ensureTex();
  setTimeout(gen, 30);
})();
ensureTex(); showModeTag();
// open on the camera
$('miniCam').style.visibility = 'hidden'; buildStrip(); tick(); startCam();
}
</script>
